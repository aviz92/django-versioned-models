[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "django-versioned-models"
version = "1.3.0"
description = "Drop-in versioning for Django models — releases, data status workflow, and CI integration"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "aviz92" }]
requires-python = ">=3.12"
keywords = ["django", "versioning", "models", "release", "data-management"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Framework :: Django",
    "Framework :: Django :: 5.0",
    "Framework :: Django :: 5.1",
    "Framework :: Django :: 5.2",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
]

dependencies = [
    "django>=5.2",
]

[dependency-groups]
dev = [
    "custom-python-logger>=4.2.0",
    "pre-commit>=4.7.0",
    "pytest>=9.2.0",
    "pytest-better-report>=1.0.3",
    "pytest-django>=4.14.0",
    "python-base-command>=1.0.0",
    "python-base-toolkit>=1.2.1",
]

[project.urls]
Homepage = "https://github.com/aviz92/django-versioned-models"
Repository = "https://github.com/aviz92/django-versioned-models"
Issues = "https://github.com/aviz92/django-versioned-models/issues"

[tool.hatch.build.targets.wheel]
packages = ["django_versioned_models"]

[tool.hatch.build.targets.wheel.sources]
"django_versioned_models" = "django_versioned_models"

[tool.hatch.build.targets.sdist]
include = [
    "django_versioned_models/**/*.py",
    "django_versioned_models/migrations/*.py",
]
